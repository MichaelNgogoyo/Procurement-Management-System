# Database Configuration
spring.datasource.url=jdbc:postgresql://shinkansen.proxy.rlwy.net:25255/railway
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${PORT:8081}

# CORS Configuration
spring.mvc.cors.allowed-origins=${FRONTEND_URL:http://localhost:8080}
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=true
spring.mvc.cors.max-age=3600

# Auth Configuration
auth.client.id=client
auth.client.secret=secret
auth.token.url=${URL}/oauth/token

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=public
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.connect-retries=5
spring.flyway.connect-retries-interval=5

# OpenAPI Documentation
springdoc.api-docs.path=/api-docs
springdoc.pathsToMatch=/api/**

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,flyway
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.flywaydb=DEBUG
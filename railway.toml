[build]
builder = "DOCKERFILE"
dockerfilePath = "./Dockerfile"

[deploy]
startCommand = "docker compose up"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "db"
volume = "/var/lib/postgresql/data"

[[services]]
name = "backend"
healthcheckPath = "/actuator/health"
healthcheckTimeout = 100

[[services]]
name = "frontend"
healthcheckPath = "/"
healthcheckTimeout = 100 
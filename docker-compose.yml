version: '3.8'

services:
  frontend:
    build: 
      context: ./Modernprocore-UI
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
      - VUE_APP_API_ENDPOINT=http://localhost:8081/
      - VUE_APP_CLIENT_ID=client
      - VUE_APP_CLIENT_SECRET=secret
    depends_on:
      - backend
    networks:
      - modernprocure-network

  backend:
    build: 
      context: ./modernprocure/modernprocure
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/ted
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=strongpassword
      - AUTH_TOKEN_URL=http://localhost:8081/oauth/token
      - AUTH_CLIENT_ID=client
      - AUTH_CLIENT_SECRET=secret
    depends_on:
      - db
    networks:
      - modernprocure-network

  db:
    image: postgres:14-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=ted
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=strongpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - modernprocure-network

volumes:
  postgres_data:

networks:
  modernprocure-network:
    driver: bridge 